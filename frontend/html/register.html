<!DOCTYPE html>
<html>
    <head>
        <title>Groupies</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <header>
            <h1>Groupies</h1>
            <button class = "button" type="button">Find your next trips</button>
            <div id="loginregDiv">  
                <button class="button" type="button">Login</button>
                <button class="button button1" type="button" id="register">Register</button>
            </div>
        </header>

        <main>
            <section class="register-box-top">
                <h3>Registration</h3>
            <section class="register-box" id="reg-box">
                <ul>
                    <li>
                        <form id="form">
                            <p id="step1">
                                <input type="text" id="firstName" name="firstName" placeholder="First Name" class="reg-box-inputs">
                                <input type="text" id="lastName" name="lastName" placeholder="Last Name" class="reg-box-inputs">
                                <input type="password" id="password" name="password" placeholder="Password" class="reg-box-inputs">
                                <input type="email" id="email" name="email" placeholder="Email" class="reg-box-inputs">
                            </p>
                            <p hidden id="step2">
                                <textarea role="textbox" id="bio" name="bio" placeholder="Bio" class="reg-box-inputs-bio"></textarea>
                                <input 
                                    type="file" 
                                    id="img" 
                                    name="picture"
                                    accept="image/png, image/jpeg"
                                    class="reg-box-inputs"/>
                                <!-- <div class="preview">
                                    
                                </div> -->
                                <!-- <input type="date" id="age" name="age" placeholder="DD-MM-YYYY" class="reg-box-inputs"><br> -->
                                <input type="text" id="age" name="age" placeholder="Temp Age" class="reg-box-inputs"><br>
                                <label>Choose your gender:</label><br>
                                <input type="radio" id="male" name="gender" value="Male">
                                <label for="male">Male</label><br>
                                <input type="radio" id="female" name="gender" value="Female">
                                <label for="female">Female</label><br>
                                <input type="radio" id="other" name="gender" value="Other">
                                <label for="other">Other</label><br>
                            </p>
                            <p hidden id="step3">
                                
                            </p>
                            <div class="center-align">
                                <button class="trans-box-button trans-box-button1" type="button" id="return">Back</button>
                                <button class="box-button box-button1" type="button" id="next">Next</button>
                                <button hidden class="box-button box-button11" type="submit" id="submit">Submit</button>
                            </div>
                            <div id="page" class="center-align">
                                Step 1/3
                            </div>
                        </form>
                    </li>
                </ul>
            </section>
            </section>


        </main>

    </body>
    <script type="module" src="../src/register.js"></script>

    </html>
