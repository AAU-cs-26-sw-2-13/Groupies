<!DOCTYPE html>
<html>
    <head>
        <title>Groupies</title>
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body>
        <header></header><!-- The navigation header will go here -->

        <main class="center-align">
            <section class="register-box-top">
                <h3>Registration</h3>
            <section class="register-box active" id="reg-box">
                <ul>
                    <li>
                        <form id="form">
                            <div id="step1">
                                <input type="text" id="firstName" name="firstName" placeholder="First Name" class="reg-box-inputs">
                                <input type="text" id="lastName" name="lastName" placeholder="Last Name" class="reg-box-inputs">
                                <input type="password" id="password" name="password" placeholder="Password" class="reg-box-inputs">
                                <input type="email" id="email" name="email" placeholder="Email" class="reg-box-inputs">
                            </div>
                            <div hidden id="step2">
                                <textarea role="textbox" id="bio" name="bio" placeholder="Bio" class="reg-box-inputs"></textarea>
                                <input 
                                    type="file" 
                                    id="img" 
                                    name="picture"
                                    accept="image/png, image/jpeg"
                                    class="reg-box-inputs"/>
                                <div class="preview">
                                    
                                </div>
                                <label class="calendar-interactable" id="dobBox" style="width: 100%;">
                                    <i class="fa-regular fa-calendar"></i>
                                    <span id="dobText"> Date of Birth</span>
                                    <input type="date" id="dob" name="dob" class="calenderDisplay">
                                </label>
                                <!--All countries and their contry code-->
                                <!--The code below comes from the website https://www.html-code-generator.com/drop-down/country-names, all credit to them
                                This is used so we did not have to spend time writing every country.-->
                                <div id="countryDiv">
                                    
                                </div>
                                <div class="genderChooserBox">
                                    <label class="chooseGendetHeadTitle">Choose your gender:</label><br>
                                    <div class="registerGenderDiv">
                                        <input class="registerGenderRadioButton" type="radio" id="male" name="gender" value="Male">
                                        <label class="registerGenderTextButton" for="male">Male</label><br>
                                        <input class="registerGenderRadioButton" type="radio" id="female" name="gender" value="Female">
                                        <label class="registerGenderTextButton" for="female">Female</label><br>
                                        <input class="registerGenderRadioButton" type="radio" id="other" name="gender" value="Other">
                                        <label class="registerGenderTextButton" for="other">Other</label><br>
                                    </div>
                                </div>
                            </div>
                            <div hidden id="step3">
                                <ul class="registerPreferenceList"></ul>
                                <ul class="registerPreferenceListActive"></ul>
                            </div>
                            <div class="center-align">
                                <button class="trans-box-button trans-box-button1" type="button" id="return">Back</button>
                                <button class="box-button box-button1" type="button" id="next">Next</button>
                                <button hidden class="box-button box-button11" type="submit" id="submit">Submit</button>
                            </div>
                            <div id="page" class="center-align">
                                <p class="currentRegisterPage">1/3</p>
                            </div>
                        </form>
                    </li>
                </ul>
            </section>
            </section>


        </main>

    </body>
    <script type="module" src="../js/loadRegister.js"></script>

    </html>
