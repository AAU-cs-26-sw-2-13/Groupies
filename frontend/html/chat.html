<!DOCTYPE html>
<html>
    <head>
        <title>Groupies</title>
        <link rel="stylesheet" href="/css/style.css">
        <script src="/socket.io/socket.io.js"></script> <!--SocketIO - used for websocket logic-->
    </head>
    <body>
        <header></header> <!-- The navigation header will go here -->
        <article class="chatArticle">
            <div class="contacts">
                <section class="userContactsSection">
                    <h2 class="userContactsText">User contacts</h2>
                    <ul class="userContactList">
                        <!--<li>
                            <div class="userContactElement">
                                <div class = "usercontactInfo">
                                    <img class="userImage" src="/img/accountPlaceholder.svg">
                                    <p class="userContactName">Julie</p>
                                </div>
                                <button type="button" class="button2">Profile</button>
                            </div>
                        </li>-->
                    </ul>
                </section>
                <section class="groupContacts">
                    <h2 class="userContactsText">Group Contacts</h2>
                    <ul class="groupContactList">
                        <li>
                            <div class="userContactElement">
                                <div class = "usercontactInfo">
                                    <img class="userImage" src="/img/notFound.jpg">
                                    <div class="tripContactTextInfo">
                                        <p>Italy 2026</p>
                                        <p>July 19, 2026 -</p>
                                        <p>August 19, 2026</p>
                                    </div>
                                </div>
                                <button type="button" class="button2">Group</button>
                            </div>
                        </li>
                    </ul>
                </section>
            </div>
            <section class="chatBox">
                <div class="chatBoxTop">
                    <img class="activeChatImage activeChatImage" src="/img/accountPlaceholder.svg">
                    <h2 class="activeChatName">Julie Roberts</h2>
                </div>
                <section class="chatHistory">
                    <ul class="chatHistoryList">
                        <!--<li><p class="opponentChatter">Hello what are you doing this easter?</p></li>
                        <li><p class="currentChatter">Hi im travelling to barcelone</p></li>-->
                        
                    </ul>
                </section>
                <div class="messageSendContainer">
                    <textarea class="messageInputBox" placeholder="Enter new message"></textarea>
                    <button class="sendMessageButton" type="button">Send</button>
                </div>
            </section>
        </article>
        
    </body>
</html>
<script type="module" src="/js/loadChat.js"></script>
